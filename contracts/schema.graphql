# infra-bff-mobile：手写 GraphQL schema，本组件唯一的对外契约
#
# 不是从任何 .proto 生成的：按移动端页面裁剪，不是各组件契约的机械并集。字段
# 直接对应各后端组件契约里已有的字段（camelCase 化），不做额外加工或计算。
#
# 装配时按可选依赖裁剪：这次装配没有的组件，对应的 Query / Mutation 字段在
# 构建 schema 时根本不注册（不是注册了返回 null）——否则 introspection 会把
# 字段暴露出去，前端按 schema 写了查询、运行时永远拿到 null，"页面空白但不
# 报错"。本文件是全量版本（所有可选依赖都在时的 schema），`src/schema.ts`
# 启动时按实际装配裁出子集；一个 Mutation 都不剩时整个 Mutation 类型不出现。
#
# 两类读的权限模型不同，判据是数据来源组件有没有真实的数据范围：
#   - customer / product / searchProducts：mdm-customer、mdm-product 是
#     data_scopes: none（全员可见），走 gRPC（BatchGet + DataLoader 防 N+1，
#     搜索走 List 的 q）。
#   - 订单、库存、待办、通知、商机：erp-sales（org/owner）、erp-inventory
#     （warehouse）、infra-workflow（org/owner）、infra-notification（owner）、
#     crm-opportunity（org/owner）都有真实数据范围，而组件之间的 gRPC 协议不按
#     调用者过滤——这些字段一律走 REST，原样转发调用者的 Authorization，由
#     下游判。走 gRPC 就绕开了数据权限：传一个别人的 id 就能看到别人的数据。
#
# 写操作只有待办的同意 / 驳回：纯转发，带调用方给的幂等键，不在本组件里编排
# 多个下游。下游（REST 或 gRPC）拒绝时字段上的错误带 extensions.code：
# UNAUTHENTICATED（下游不认这个 token，重新登录）、FORBIDDEN、NOT_FOUND、
# CONFLICT（状态已变，刷新）、BAD_USER_INPUT；其余失败对客户端显示为通用错误，
# 原因在日志里。

scalar DateTime

type Query {
  # ── mdm-customer（data_scopes: none，gRPC BatchGet，DataLoader 防 N+1） ──
  customer(id: ID!): Customer
  customers(ids: [ID!]!): [Customer]!

  # ── mdm-product（data_scopes: none，gRPC） ──
  product(id: ID!): Product
  products(ids: [ID!]!): [Product]!
  # 按 sku / name 关键字找产品（mdm-product List 的 q）：前缀匹配排在包含匹配前面，
  # 与 mdm-product 的列表一样只查默认时间窗口内建档的产品。
  searchProducts(keyword: String!, cursor: String, pageSize: Int): ProductPage!

  # ── erp-sales（org/owner 数据范围，REST 转发） ──
  order(id: ID!): Order
  myOrders(cursor: String, pageSize: Int, statusFilter: OrderStatus, customerId: ID): OrderPage!

  # ── erp-inventory（warehouse 数据范围，REST 转发） ──
  # 给定产品与仓库查一条余额，没有批量端点，所以不经 DataLoader。
  inventoryBalance(productId: ID!, warehouseId: ID!): InventoryBalance
  # 一个产品在调用者有授权的各仓库里的余额，游标分页。
  inventoryBalances(productId: ID!, cursor: String, pageSize: Int): InventoryBalancePage!
  # 调用者有授权的全部仓库（几十行量级，不分页）。
  warehouses: [Warehouse!]!

  # ── infra-workflow（org/owner 数据范围，REST 转发；移动端主场景） ──
  myTasks(cursor: String, pageSize: Int, type: TaskType, status: TaskStatus): TaskPage!
  # 待办详情，含审批历史（actions）。
  task(id: ID!): Task

  # ── infra-notification（owner 数据范围，REST 转发） ──
  myNotifications(cursor: String, pageSize: Int): NotificationPage!

  # ── crm-opportunity（org/owner 数据范围，REST 转发） ──
  # 我负责的商机（view=mine）。
  myOpportunities(cursor: String, pageSize: Int, status: OpportunityStatus): OpportunityPage!
  opportunity(id: ID!): Opportunity
}

type Mutation {
  # ── infra-workflow：同意 / 驳回一条待办，返回处理后的详情（含 actions） ──
  # idempotencyKey 可选：给了就原样转发（body 的 idempotency_key），没给就不带这个
  # 字段；本组件不生成、不改写。去重不靠它：待办只能从待处理状态被处理一次，第一次
  # 已经成功时，重试得到 CONFLICT，刷新即可，不会处理两次。
  approveTask(id: ID!, comment: String, idempotencyKey: String): Task!
  # 驳回必须带附言：发起人要知道该改什么。
  rejectTask(id: ID!, comment: String!, idempotencyKey: String): Task!
}

# ============ mdm-customer ============

enum CustomerStatus {
  ACTIVE
  DISABLED
}

type Contact {
  id: ID!
  name: String!
  phone: String!
  email: String!
  primary: Boolean!
}

type BillingInfo {
  id: ID!
  title: String!
  taxNo: String!
  bankName: String!
  bankAccount: String!
  address: String!
}

type Customer {
  id: ID!
  code: String!
  name: String!
  taxNo: String!
  creditLimit: String! # decimal-as-string，前端不做任何计算
  status: CustomerStatus!
  version: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
  contacts: [Contact!]!
  billingInfos: [BillingInfo!]!
}

# ============ mdm-product ============

enum ProductStatus {
  ACTIVE
  DISABLED
}

enum TrackingType {
  NONE
  BATCH
  SERIAL
}

type Product {
  id: ID!
  sku: String!
  name: String!
  categoryId: String!
  baseUomId: String!
  trackingType: TrackingType!
  standardCost: String! # decimal-as-string
  status: ProductStatus!
  version: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type ProductPage {
  products: [Product!]!
  nextCursor: String!
}

# ============ erp-sales ============

enum OrderStatus {
  DRAFT
  CONFIRMED
  SHIPPED
  COMPLETED
  CANCELLED
  CLOSED
  SUSPENDED
}

type OrderItem {
  productId: ID!
  productSku: String!
  productName: String!
  uomId: String!
  qty: String! # decimal-as-string
  unitPrice: String! # decimal-as-string，快照
  discount: String! # decimal-as-string，0~1
  taxRate: String! # decimal-as-string
  subtotal: String! # 服务端算好，前端不自己算钱
}

type Order {
  id: ID!
  orderNo: String!
  customerId: ID!
  customerName: String! # 快照
  status: OrderStatus!
  items: [OrderItem!]!
  totalAmount: String! # decimal-as-string
  deptId: String!
  deptPath: String!
  ownerId: String!
  reservationId: String!
  version: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type OrderPage {
  orders: [Order!]!
  nextCursor: String!
}

# ============ erp-inventory ============

type InventoryBalance {
  productId: ID!
  warehouseId: ID!
  onHandQty: String! # decimal-as-string
  reservedQty: String! # decimal-as-string
  availableQty: String! # onHandQty - reservedQty，服务端算好
  version: Int!
}

type InventoryBalancePage {
  balances: [InventoryBalance!]!
  nextCursor: String!
}

type Warehouse {
  id: ID!
  code: String!
  name: String!
  status: String!
}

# ============ infra-workflow ============

enum TaskType {
  APPROVAL
  EXCEPTION
}

enum TaskStatus {
  PENDING
  APPROVED
  REJECTED
  RESOLVED
  CANCELLED
}

type Task {
  id: ID!
  type: TaskType!
  status: TaskStatus!
  assigneeSub: String!
  assigneeDeptPath: String!
  title: String!
  summaryJson: String! # 展示快照原样透传，前端自己解析，本组件不理解其内容
  sourceComponent: String!
  sourceAggregate: String!
  sourceId: String!
  deepLink: String!
  dueAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
  # 审批历史：task / approveTask / rejectTask 返回它；myTasks 的列表接口不带历史，为 null。
  actions: [TaskAction!]
}

enum TaskActionType {
  APPROVED
  REJECTED
  CLOSED
  CANCELLED
}

type TaskAction {
  actorSub: String!
  action: TaskActionType!
  comment: String!
  createdAt: DateTime!
}

type TaskPage {
  tasks: [Task!]!
  nextCursor: String!
}

# ============ infra-notification ============

enum NotificationChannel {
  IM
  EMAIL
  SMS
}

enum NotificationStatus {
  PENDING
  ACCEPTED
  SENT
  FAILED_PERMANENT
  SUPPRESSED
  RETRYING
}

type Notification {
  id: ID!
  category: String!
  channel: NotificationChannel!
  title: String!
  body: String!
  status: NotificationStatus!
  sourceComponent: String!
  sourceAggregate: String!
  sourceId: String!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type NotificationPage {
  notifications: [Notification!]!
  nextCursor: String!
}

# ============ crm-opportunity ============

enum OpportunityStatus {
  OPEN
  WON
  LOST
  CANCELLED
}

type OpportunityItem {
  productId: ID!
  productSku: String!
  productName: String!
  uomId: String!
  qty: String! # decimal-as-string
  quotedUnitPrice: String! # 报价快照，不是权威价目
  subtotal: String! # 服务端算好
}

type Opportunity {
  id: ID!
  name: String!
  customerId: ID!
  customerName: String!
  ownerId: String!
  deptId: String!
  deptPath: String!
  stageId: String!
  stageName: String!
  items: [OpportunityItem!]!
  expectedAmount: String! # decimal-as-string
  probability: Int! # 0-100
  weightedAmount: String! # expectedAmount × probability，服务端算好
  expectedCloseDate: DateTime
  status: OpportunityStatus!
  currency: String!
  lostReason: String!
  wonAt: DateTime
  orderId: String! # 赢单转出的订单 id，未转为空串
  version: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type OpportunityPage {
  opportunities: [Opportunity!]!
  nextCursor: String!
}
