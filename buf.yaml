version: v2
modules:
  # 依赖方契约的只读镜像：本组件不从这些 proto 生成任何代码，
  # `@grpc/proto-loader` 运行期直接读 .proto。只做最基础的语法检查：
  # PACKAGE_DIRECTORY_MATCH 要求目录匹配包名，这里故意多一层 vendor/
  # 前缀，标明"这是上游的镜像，不是本组件的契约"。
  - path: contracts/vendor
    lint:
      use:
        - MINIMAL
      except:
        - PACKAGE_DIRECTORY_MATCH
