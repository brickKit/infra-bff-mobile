version: v2
modules:
  # 依赖方契约的只读镜像——本组件不从这些 proto 生成任何代码（没有
  # codegen 步骤，`@grpc/proto-loader` 运行时直接读 .proto 文件，见
  # docs/手册.md）。只放最基础的语法检查，不对目录结构较真——
  # PACKAGE_DIRECTORY_MATCH 要求目录匹配包名，这里故意多一层 vendor/
  # 前缀标记"这是镜像不是本组件的契约"（同 erp-sales 的既有先例）。
  - path: contracts/vendor
    lint:
      use:
        - MINIMAL
      except:
        - PACKAGE_DIRECTORY_MATCH
