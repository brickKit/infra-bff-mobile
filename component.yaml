                                      # v1.0.20：Node 运行时从设计书§12.4 锁定的 Node 20 升级到当前最新维护版 LTS Node 24（05b Task 9 真机验证裸进程时发现，依赖树的 graphql@17、 @prometheus-io/client 已经要求 Node ≥22，原锁定版本已经滞后）。 Dockerfile 两个阶段的基底镜像改成 node:24-slim，package.json 的 engines.node 改成 >=24，node_modules 在 Node 24 下重装、npm run build 与 vitest 单测全部通过，无业务行为/契约变更。
