apiVersion: brickkit/v1
kind: Component

metadata:
  id: infra/bff-mobile
  name: Mobile BFF
  version: 2.0.0
  description: GraphQL backend-for-frontend for the mobile app; a schema cut to the pages, batched loading, no business logic and no database.
  repository: https://github.com/brickKit/infra-bff-mobile
  license: Apache-2.0
  vendor: brickKit

tags: [infra, bff, graphql, typescript, mobile]

artifacts:
  - type: api-contract
    format: graphql
    files: [contracts/schema.graphql]
  - type: metadata
    files: [assembly.yaml]

dependencies:
  components:
    - id: mdm/customer@2.0.1
      optional: true
    - id: mdm/product@2.0.0
      optional: true
    - id: erp/sales@2.0.0
      optional: true
    - id: erp/inventory@2.0.0
      optional: true
    - id: infra/workflow@2.0.1
      optional: true
    - id: infra/notification@2.0.0
      optional: true
    - id: crm/opportunity@2.0.0
      optional: true

configSchema:
  type: object
  properties:
    OTEL_BASE_URL: {type: string, default: ""}
    AUTHZ_BUNDLE_URL: {type: string}
    IAM_JWKS_URL: {type: string}
    PERSISTED_OPERATIONS_JSON: {type: string, default: ""}
  required: [AUTHZ_BUNDLE_URL, IAM_JWKS_URL]

deployment:
  type: container
  build: {context: ., dockerfile: Dockerfile}
  port: 8500
  labels:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8500"
    prometheus.io/path: /metrics

healthCheck:
  type: http
  path: /healthz
  startPeriodSeconds: 90

local:
  language: node
  runCommand: [sh, "-c", "npm run build && node dist/main.js"]
